# Postgres local con healthcheck (el hosteado en Neon es el de produccion).
services:
  postgres_local:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:-pipeline_elt}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

volumes:
  postgres_local_data:
